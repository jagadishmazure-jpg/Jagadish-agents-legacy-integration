[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-legacy-integration"
version = "0.1.0"
description = "Safe AI-agent access to COBOL (GnuCOBOL), AS/400-style 5250 screens, MQ request/reply, DB2-for-i style SQL and CDC"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.1"]

[project.scripts]
legacyagents = "legacyagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
